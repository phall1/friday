name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    name: Apple Silicon macOS Build, Contracts, and UI
    runs-on: macos-14-xlarge
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Refuse Intel and Rosetta runners
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || printf '0')" = 0
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify and apply the pinned Native SDK patch
        run: npx patch-package --error-on-fail
      - name: Check Native core, markup, and manifest
        run: npm run check
      - name: Build the arm64-only macOS application
        run: npm run build
      - name: Run TypeScript and native contract tests
        run: npm test
      - name: Verify icon reproducibility
        run: |
          set -euo pipefail
          generated="$(mktemp -t friday-icon).png"
          trap 'rm -f "$generated"' EXIT
          swift scripts/generate-icon.swift assets/icon.svg "$generated"
          cmp "$generated" assets/icon.png
      - name: Build and verify automation-enabled arm64 development binary
        run: |
          zig build -Dtarget=aarch64-macos -Dautomation=true
          test "$(lipo -archs zig-out/bin/friday)" = arm64
          file zig-out/bin/friday | grep -q arm64
          ! file zig-out/bin/friday | grep -q x86_64
      - name: Compare all UI, accessibility, and keyboard goldens
        env:
          FRIDAY_APP_BINARY: ${{ github.workspace }}/zig-out/bin/friday
          FRIDAY_NATIVE_CLI: ${{ github.workspace }}/node_modules/.bin/native
        run: |
          set -euo pipefail
          scenes=(
            onboarding-light settings-dark model-light error-dark
            recording-light transcribing-dark overlay-preview-light accessibility-dark
            unsupported-intel-light hotkey-conflict-light resume-light hf-confirmation-dark
          )
          for scene in "${scenes[@]}"; do
            tests/ui-automation.sh "$scene"
          done
